name: JDSS V3.1.1 Stage Score Threshold Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_stage_score_thresholds.py"
      - "scripts/research_stage_score_shard.py"
      - "scripts/research_stage_score_finalize.py"
      - ".github/workflows/research-stage-score-thresholds.yml"

permissions:
  contents: read

jobs:
  development:
    name: development-s1-${{ matrix.s1 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        s1: [45, 50, 55, 60, 65]
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint research scripts
        run: |
          ruff check scripts/research_stage_score_thresholds.py \
            scripts/research_stage_score_shard.py \
            scripts/research_stage_score_finalize.py
      - name: Run S1 shard
        run: |
          mkdir -p reports/shards
          python -m scripts.research_stage_score_shard \
            --s1 ${{ matrix.s1 }} \
            --output reports/shards/stage_score_s1_${{ matrix.s1 }}.json \
            --csv reports/shards/stage_score_s1_${{ matrix.s1 }}.csv \
            --slippage 0.001
      - name: Upload shard
        uses: actions/upload-artifact@v6
        with:
          name: stage-threshold-dev-${{ matrix.s1 }}
          path: |
            reports/shards/stage_score_s1_${{ matrix.s1 }}.json
            reports/shards/stage_score_s1_${{ matrix.s1 }}.csv

  finalize:
    name: finalize-oos
    needs: development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Download development shards
        uses: actions/download-artifact@v7
        with:
          pattern: stage-threshold-dev-*
          path: reports/shards
          merge-multiple: true
      - name: Finalize locked candidates
        run: |
          python -m scripts.research_stage_score_finalize \
            --grid-glob 'reports/shards/stage_score_s1_*.csv' \
            --output reports/stage_score_thresholds.json \
            --csv reports/stage_score_thresholds_grid.csv \
            --slippage 0.001
      - name: Publish research summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("reports/stage_score_thresholds.json").read_text(encoding="utf-8"))
          lines = [
              "# S1/S2/S3 score threshold research",
              "",
              f"- Strategy: {report['strategy_version']}",
              f"- Research end: {report['research_end']}",
              f"- Grid: {report['method']['candidate_count']} candidates",
              "",
              "## Locked candidates",
              "",
              "| Label | S1/S2/S3 | 2023+ CAGR | 2023+ MDD | 2023+ Sharpe | 2022+ CAGR | 2022+ MDD |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for label, spec in report["locked_specs"].items():
              oos = report["final_periods"]["oos"][label]
              recent = report["final_periods"]["recent"][label]
              lines.append(
                  f"| {label} | {'/'.join(map(str, spec))} | "
                  f"{oos['cagr_pct']:.2f}% | {oos['mdd_pct']:.2f}% | {oos['sharpe']:.3f} | "
                  f"{recent['cagr_pct']:.2f}% | {recent['mdd_pct']:.2f}% |"
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          Path("reports/stage_score_thresholds_summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload final research artifacts
        uses: actions/upload-artifact@v6
        with:
          name: stage-score-thresholds-${{ github.run_id }}
          path: |
            reports/stage_score_thresholds.json
            reports/stage_score_thresholds_grid.csv
            reports/stage_score_thresholds_summary.md
