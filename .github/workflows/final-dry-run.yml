name: JDSS V3 Dry Run

on:
  pull_request:
    paths:
      - "strategy.yaml"
      - "src/jd_holdings/**"
      - "tests/test_final_dry_run.py"
      - "tests/test_idle_cash_manager.py"
      - "tests/test_v3_portfolio.py"
      - ".github/workflows/final-dry-run.yml"

permissions:
  contents: read

jobs:
  final-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run JDSS V3 end-to-end dry run
        run: pytest -q tests/test_final_dry_run.py tests/test_idle_cash_manager.py tests/test_v3_portfolio.py
