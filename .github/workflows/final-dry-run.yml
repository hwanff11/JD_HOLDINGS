name: JDSS V3 Dry Run

on:
  pull_request:
    paths:
      - "strategy.yaml"
      - "src/jd_holdings/**"
      - "tests/test_final_dry_run.py"
      - "tests/test_idle_cash_manager.py"
      - "tests/test_v3_portfolio.py"
      - "tests/test_v31_managed_account_safety.py"
      - "tests/test_v31_core_approval_safety.py"
      - "tests/test_v31_operational_faults.py"
      - "tests/test_v31_runtime_resilience.py"
      - "tests/test_v31_telegram_guide.py"
      - ".github/workflows/final-dry-run.yml"

permissions:
  contents: read

jobs:
  final-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run JDSS V3.1.1 end-to-end and fault-injection dry run
        run: >-
          pytest -q
          tests/test_final_dry_run.py
          tests/test_idle_cash_manager.py
          tests/test_v3_portfolio.py
          tests/test_v31_managed_account_safety.py
          tests/test_v31_core_approval_safety.py
          tests/test_v31_operational_faults.py
          tests/test_v31_runtime_resilience.py
          tests/test_v31_telegram_guide.py
