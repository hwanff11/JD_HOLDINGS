name: CI - Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only pull request
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/changed-files
          if grep -Ev '\.md$' /tmp/changed-files | grep -q .; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint - Ruff
        if: steps.scope.outputs.run_full == 'true'
        run: ruff check .

      - name: Unit tests - Pytest
        if: steps.scope.outputs.run_full == 'true'
        # Current suite is ~70.4%; this is a ratchet floor, not a target.
        # Raise it as coverage improves and do not lower it without explicit review.
        run: pytest --cov=jd_holdings --cov-report=term-missing --cov-fail-under=70

      - name: Config validation - JDSS
        if: steps.scope.outputs.run_full == 'true'
        run: jdss validate-config

      - name: Record documentation-only fast path
        if: steps.scope.outputs.run_full != 'true'
        run: echo 'QUALITY_GATE=PASS_DOCS_ONLY' >> "$GITHUB_STEP_SUMMARY"

  cleanup-retired-workflow-runs:
    name: Cleanup retired workflow runs
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'maintenance/cleanup-retired-workflow-runs'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs belonging only to retired workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          retired_paths=(
            ".github/workflows/v322-config-contract-fix.yml"
            ".github/workflows/jdss-hybrid-research.yml"
            ".github/workflows/research-atr-redundancy.yml"
            ".github/workflows/research-stage-score-extended.yml"
            ".github/workflows/research-monthly-returns.yml"
            ".github/workflows/jdss-oversold-ablation.yml"
            ".github/workflows/research-oversold-internals.yml"
            ".github/workflows/research-oversold-quick.yml"
            ".github/workflows/research-score-ablation-frequency.yml"
            ".github/workflows/research-score-ablation-threshold.yml"
            ".github/workflows/research-score-weights-fast.yml"
            ".github/workflows/research-score-weights.yml"
            ".github/workflows/research-stage-candidate-validation.yml"
            ".github/workflows/research-stage-score-probe.yml"
            ".github/workflows/research-stage-score-thresholds.yml"
            ".github/workflows/jdss-profit-lock-parity.yml"
            ".github/workflows/jdss-v31-v32-compare.yml"
            ".github/workflows/research-backtest.yml"
            ".github/workflows/research-v322-calendar-phase.yml"
            ".github/workflows/v322-format-final.yml"
            ".github/workflows/research-v322-lookback.yml"
            ".github/workflows/v322-promotion-batch-fix.yml"
            ".github/workflows/research-v322-promotion-debug.yml"
            ".github/workflows/research-v322-signal-proxy.yml"
            ".github/workflows/research-v322-sleeve.yml"
          )

          deleted=0
          for path in "${retired_paths[@]}"; do
            workflow_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
              --jq ".workflows[] | select(.path == \"$path\") | .id" | head -n1)"
            if [[ -z "$workflow_id" ]]; then
              echo "Already absent: $path"
              continue
            fi
            mapfile -t run_ids < <(
              gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" \
                --jq '.workflow_runs[].id'
            )
            for run_id in "${run_ids[@]}"; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
              deleted=$((deleted + 1))
            done
            echo "Deleted ${#run_ids[@]} runs: $path"
          done
          echo "RETIRED_WORKFLOW_RUNS_DELETED=$deleted" >> "$GITHUB_STEP_SUMMARY"
