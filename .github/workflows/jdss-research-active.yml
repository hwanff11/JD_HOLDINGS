name: Research - JDSS V3 Active

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_active.py"
      - "scripts/research_risk_budget.py"
      - "scripts/research_profit_frontier.py"
      - "scripts/research_profit_lock_parity.py"
      - "tests/test_profit_lock_parity.py"
      - "pyproject.toml"
      - ".github/workflows/jdss-research-active.yml"

permissions:
  contents: read

jobs:
  research:
    name: Research - ${{ matrix.variant }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - monthly_contrib
          - monthly_equity
          - quarterly_profit
          - step10_quarterly
          - step10_reserve_sgov
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run research variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: python scripts/research_active.py --variant "$VARIANT" --output "result-$VARIANT.json"

      - name: Print and publish research result
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "===== JDSS RESEARCH RESULT: $VARIANT ====="
          python scripts/research_active.py --summarize "result-$VARIANT.json" | tee research-summary.md
          {
            echo "## $VARIANT"
            cat research-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed result archive
        uses: actions/upload-artifact@v6
        with:
          name: active-${{ matrix.variant }}-${{ github.run_id }}
          path: result-${{ matrix.variant }}.json

  risk-budget:
    name: Risk Budget - ${{ matrix.variant }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - fixed50
          - fixed50_harvest
          - step5
          - contrib_profit25
          - contrib_profit50
          - fixed50_dd
          - fixed50_harvest_dd
          - fixed50_corr60
          - fortress50
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run risk-budget variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m scripts.research_risk_budget \
            --variant "$VARIANT" \
            --output "risk-$VARIANT.json"

      - name: Print and publish risk-budget result
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "===== JDSS RISK-BUDGET RESULT: $VARIANT ====="
          python -m scripts.research_risk_budget \
            --summarize "risk-$VARIANT.json" \
            | tee risk-summary.md
          {
            echo "## Risk Budget: $VARIANT"
            cat risk-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed result archive
        uses: actions/upload-artifact@v6
        with:
          name: risk-${{ matrix.variant }}-${{ github.run_id }}
          path: risk-${{ matrix.variant }}.json

  profit-frontier:
    name: Profit Frontier - ${{ matrix.frontier }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontier:
          - direct30
          - direct35
          - direct40
          - direct45
          - step5_profit25
          - step5_profit35
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run frontier variant
        env:
          FRONTIER: ${{ matrix.frontier }}
        run: |
          python -m scripts.research_profit_frontier \
            --frontier "$FRONTIER" \
            --output "frontier-$FRONTIER.json"

      - name: Print and publish frontier result
        env:
          FRONTIER: ${{ matrix.frontier }}
        run: |
          echo "===== JDSS PROFIT FRONTIER: $FRONTIER ====="
          python -m scripts.research_profit_frontier \
            --summarize "frontier-$FRONTIER.json" \
            | tee frontier-summary.md
          {
            echo "## Profit Frontier: $FRONTIER"
            cat frontier-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed result archive
        uses: actions/upload-artifact@v6
        with:
          name: frontier-${{ matrix.frontier }}-${{ github.run_id }}
          path: frontier-${{ matrix.frontier }}.json

  profit-lock-parity:
    name: Profit Lock Parity - ${{ matrix.variant }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - profit0
          - profit25
          - profit30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run production-parity variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m scripts.research_profit_lock_parity \
            --variant "$VARIANT" \
            --output "parity-$VARIANT.json"

      - name: Print and publish parity result
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "===== JDSS PROFIT LOCK PARITY: $VARIANT ====="
          python -m scripts.research_profit_lock_parity \
            --summarize "parity-$VARIANT.json" \
            | tee parity-summary.md
          {
            echo "## Profit Lock Parity: $VARIANT"
            cat parity-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed result archive
        uses: actions/upload-artifact@v6
        with:
          name: parity-${{ matrix.variant }}-${{ github.run_id }}
          path: parity-${{ matrix.variant }}.json
