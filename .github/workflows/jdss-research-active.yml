name: Research - JDSS V3 Active

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_active.py"
      - ".github/workflows/jdss-research-active.yml"

permissions:
  contents: read

jobs:
  research:
    name: Research - ${{ matrix.variant }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline_6m, stage_10, stage_7_5]
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run research variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: python scripts/research_active.py --variant "$VARIANT" --output "result-$VARIANT.json"

      - name: Publish research summary
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "## $VARIANT" >> "$GITHUB_STEP_SUMMARY"
          python scripts/research_active.py --summarize "result-$VARIANT.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research result
        uses: actions/upload-artifact@v6
        with:
          name: active-${{ matrix.variant }}-${{ github.run_id }}
          path: result-${{ matrix.variant }}.json
