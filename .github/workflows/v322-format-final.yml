name: V3.2.2 Final Python Normalize

on:
  push:
    branches:
      - agent/v3.2.2-production-promotion

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v3.2.2-production-promotion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Normalize recently changed Python files
        run: |
          python -m pip install ruff==0.16.2 >/dev/null
          python -m ruff check --fix \
            src/jd_holdings/config.py \
            src/jd_holdings/application/order_monitor.py \
            src/jd_holdings/infrastructure/telegram_bot_final.py \
            tests/test_config.py
          python -m ruff format \
            src/jd_holdings/config.py \
            src/jd_holdings/application/order_monitor.py \
            src/jd_holdings/infrastructure/telegram_bot_final.py \
            tests/test_config.py
          rm .github/workflows/v322-format-final.yml
      - name: Commit normalization and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/v322-format-final.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize final V3.2.2 Python files [v322-format]"
          git push origin HEAD:agent/v3.2.2-production-promotion
