name: Research Initial Entry Scenarios

on:
  workflow_dispatch:
    inputs:
      end:
        description: "종료일 (비우면 최신 완결 미국 거래일)"
        required: false
        default: ""
        type: string
      stride:
        description: "역사적 시작점 거래일 간격"
        required: false
        default: "5"
        type: string
      issue_number:
        description: "결과를 남길 Issue 번호 (선택)"
        required: false
        default: ""
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  research:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[research-initial-entry]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run initial-entry scenario sweep
        env:
          INPUT_END: ${{ inputs.end }}
          INPUT_STRIDE: ${{ inputs.stride || '5' }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          args=(--stride "$INPUT_STRIDE" --output-json reports/initial-entry-research.json --output-md reports/initial-entry-research.md)
          if [[ -n "$INPUT_END" ]]; then args+=(--end "$INPUT_END"); fi
          python scripts/research_initial_entry_scenarios.py "${args[@]}"
      - name: Publish summary
        run: cat reports/initial-entry-research.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload research report
        uses: actions/upload-artifact@v7
        with:
          name: initial-entry-research-${{ github.run_id }}
          path: reports/initial-entry-research.*
      - name: Comment result on Issue
        if: ${{ github.event_name == 'issues' || inputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file reports/initial-entry-research.md
