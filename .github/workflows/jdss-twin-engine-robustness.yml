name: JDSS Twin Engine Robustness

on:
  push:
    branches: [research/jdss-simple-strategies]
    paths:
      - scripts/research_twin_engine.py
      - scripts/research_twin_engine_robustness.py
      - scripts/research_twin_engine_audit.py scripts/research_twin_engine_ledger.py
      - scripts/research_twin_engine_ledger.py
      - .github/workflows/jdss-twin-engine-robustness.yml
  pull_request:
    paths:
      - scripts/research_twin_engine.py
      - scripts/research_twin_engine_robustness.py
      - scripts/research_twin_engine_audit.py
      - scripts/research_twin_engine_ledger.py
      - .github/workflows/jdss-twin-engine-robustness.yml
  workflow_dispatch:
    inputs:
      end_date:
        description: Last completed U.S. trading session (YYYY-MM-DD)
        required: true
        default: "2026-08-10"

permissions:
  contents: read

concurrency:
  group: jdss-twin-engine-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slippage: ["0.0005", "0.001", "0.002"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check scripts/research_twin_engine_robustness.py scripts/research_twin_engine_audit.py
      - name: Run twin-engine robustness
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ matrix.slippage }}
        run: |
          python scripts/research_twin_engine_robustness.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --output reports/twin_engine_robustness.json \
            --markdown reports/twin_engine_robustness.md
      - name: Run twin-engine return-source audit
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ matrix.slippage }}
        run: |
          python scripts/research_twin_engine_audit.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --output reports/twin_engine_audit.json \
            --markdown reports/twin_engine_audit.md
      - name: Generate twin-engine execution ledger
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ matrix.slippage }}
        run: |
          python scripts/research_twin_engine_ledger.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --output reports/twin_engine_ledger.json \
            --markdown reports/twin_engine_ledger.md
      - run: cat reports/twin_engine_robustness.md reports/twin_engine_audit.md reports/twin_engine_ledger.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-twin-engine-robustness-${{ github.run_id }}-${{ matrix.slippage }}
          path: |
            reports/twin_engine_robustness.json
            reports/twin_engine_robustness.md
            reports/twin_engine_audit.json
            reports/twin_engine_audit.md
            reports/twin_engine_ledger.json
            reports/twin_engine_ledger.md
          retention-days: 30
