name: Research - JDSS Profit Lock Parity

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_profit_lock_parity.py"
      - "tests/test_profit_lock_parity.py"
      - "pyproject.toml"
      - ".github/workflows/jdss-profit-lock-parity.yml"

permissions:
  contents: read

jobs:
  parity:
    name: Profit Lock Parity - ${{ matrix.variant }}
    if: startsWith(github.head_ref, 'research/v3-active-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - profit0
          - profit25
          - profit30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run production-parity variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python -m scripts.research_profit_lock_parity \
            --variant "$VARIANT" \
            --output "parity-$VARIANT.json"

      - name: Print and publish parity result
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "===== JDSS PROFIT LOCK PARITY: $VARIANT ====="
          python -m scripts.research_profit_lock_parity \
            --summarize "parity-$VARIANT.json" \
            | tee parity-summary.md
          {
            echo "## Profit Lock Parity: $VARIANT"
            cat parity-summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload detailed result archive
        uses: actions/upload-artifact@v6
        with:
          name: parity-${{ matrix.variant }}-${{ github.run_id }}
          path: parity-${{ matrix.variant }}.json
