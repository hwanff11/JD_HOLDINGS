name: JDSS V3 Staged Core Research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  research:
    if: startsWith(github.head_ref, 'research/v3-staged-core-')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline_6m, stage_7_5, stage_5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run research variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: python scripts/research_staged_core.py --variant "$VARIANT" --output "result-$VARIANT.json"
      - name: Publish summary
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "## $VARIANT" >> "$GITHUB_STEP_SUMMARY"
          python scripts/research_staged_core.py --summarize "result-$VARIANT.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: staged-core-${{ matrix.variant }}-${{ github.run_id }}
          path: result-${{ matrix.variant }}.json
