name: Migrate Oracle Runtime to JH_HOLDINGS

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

concurrency:
  group: oracle-jdss-deploy
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[migrate-oracle-jh-runtime]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify migration safety contract
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          grep -q 'live_enabled: false' strategy.yaml
          grep -q 'JDSS-3.2.2-RS6M-ONEWAY-HWM75' strategy.yaml
          test -f scripts/migrate_oracle_runtime_to_jh.sh
          test -f systemd/jh_holdings_bot.service.template

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          chmod 600 ~/.ssh/oracle_jdss

      - name: Upload migration assets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/oracle_jdss \
            scripts/migrate_oracle_runtime_to_jh.sh systemd/jh_holdings_bot.service.template \
            "$ORACLE_USER@$ORACLE_HOST:/tmp/"

      - name: Execute rollback-safe migration
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/oracle_jdss \
            "$ORACLE_USER@$ORACLE_HOST" \
            "chmod 700 /tmp/migrate_oracle_runtime_to_jh.sh && OLD_DIR=/home/ubuntu/JD_HOLDINGS NEW_DIR=/home/ubuntu/JH_HOLDINGS OLD_SERVICE=jd_holdings_bot NEW_SERVICE=jh_holdings_bot MIGRATION_REF='${GITHUB_SHA}' SERVICE_TEMPLATE=/tmp/jh_holdings_bot.service.template /tmp/migrate_oracle_runtime_to_jh.sh"

      - name: Verify new runtime and old-service retirement
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/oracle_jdss "$ORACLE_USER@$ORACLE_HOST" bash -s <<'REMOTE'
          set -Eeuo pipefail
          test -d /home/ubuntu/JH_HOLDINGS/shared
          test -f /home/ubuntu/JH_HOLDINGS/shared/data/jdss.db
          sudo systemctl is-active --quiet jh_holdings_bot
          if sudo systemctl is-enabled --quiet jd_holdings_bot; then exit 1; fi
          set -a; source /home/ubuntu/JH_HOLDINGS/shared/.env; set +a
          test "${JDSS_TRADING_MODE:-}" = dry_run
          test -z "${JDSS_LIVE_CONFIRMATION:-}"
          /home/ubuntu/JH_HOLDINGS/venv/bin/jdss --config /home/ubuntu/JH_HOLDINGS/current/strategy.yaml validate-config
          REMOTE
