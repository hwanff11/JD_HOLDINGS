name: Release V3

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: jdss-v3-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[release-v3.0.0]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release contract
        id: ref
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "3.0.0"
          grep -q '^version: JDSS-3.0.0-TWIN-H05$' strategy.yaml
          grep -q '^config_version: "3.0.0"$' strategy.yaml
          grep -q '^  live_enabled: false$' strategy.yaml
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create v3.0.0 tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if gh release view v3.0.0 >/dev/null 2>&1; then
            echo "v3.0.0 release already exists; leaving it unchanged"
          else
            gh release create v3.0.0 \
              --target "$RELEASE_SHA" \
              --title "JDSS v3.0.0 — MONTHLY_H05 dry-run" \
              --notes-file - <<'EOF'
          ## JDSS-3.0.0-TWIN-H05

          - QQQ·SOXX 완료 월말 10개월 추세 기반 TQQQ·SOXL 코어 각각 15%
          - 기존 JDSS를 종목당 $1,000(초기 총자금 5%) 부스터로 축소
          - 코어·부스터 분리 원장, SGOV 통합 회계, 재시작 월말 복구
          - 모든 매수 Telegram 2단계 승인, 코어 위험축소 매도 자동
          - V3.0.0 전체 live 코드 잠금; Oracle dry-run 전용

          최종 main 백테스트(2011-01-01~2026-08-10, 슬리피지 0.10%): 누적 +676.17%, CAGR 14.04%, MDD -28.29%, Sharpe 0.834.

          검증: PR #35, PR #37, Issue #36, Actions run 31504080666.
          EOF
          fi
          echo "url=$(gh release view v3.0.0 --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Report release result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ v3.0.0 릴리스 생성 완료: [$RELEASE_SHA]($RELEASE_URL)\n\nActions run: $RUN_URL"
          else
            message="❌ v3.0.0 릴리스 생성 실패\n\nActions run: $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
