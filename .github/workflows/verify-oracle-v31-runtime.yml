name: Verify Oracle V3.1 Runtime

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-jdss-runtime-verify
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[verify-oracle-v31]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          chmod 600 ~/.ssh/oracle_jdss

      - name: Verify live Oracle dry-run service and isolated fault scenarios
        env:
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: ${{ vars.ORACLE_TARGET_DIR || '/home/ubuntu/JD_HOLDINGS' }}
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
        run: |
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/oracle_jdss \
            "$SERVER_USER@$SERVER_HOST" bash -s -- \
            "$SERVER_TARGET_DIR" "$REMOTE_PYTHON_BIN" <<'REMOTE'
          set -Eeuo pipefail
          target_dir="$1"
          remote_python="$2"
          service_name="jd_holdings_bot"
          env_file="$target_dir/shared/.env"
          db_path="$target_dir/shared/data/jdss.db"
          log_path="$target_dir/shared/logs/jdss.log"
          current_dir="$(readlink -f "$target_dir/current")"
          verify_root="$(mktemp -d /tmp/jdss-v31-runtime-verify.XXXXXX)"
          trap 'rm -rf "$verify_root"' EXIT

          echo "[1/7] deployed release and dry-run lock"
          test -d "$current_dir"
          grep -q 'JDSS-3.1.0-TWIN-H40-S3' "$current_dir/strategy.yaml"
          grep -q 'config_version: "3.1.0"' "$current_dir/strategy.yaml"
          set -a
          source "$env_file"
          set +a
          test "${JDSS_TRADING_MODE:-}" = "dry_run"
          test -z "${JDSS_LIVE_CONFIRMATION:-}"
          "$target_dir/venv/bin/jdss" --config "$current_dir/strategy.yaml" validate-config
          echo "release=$(basename "$current_dir") mode=dry_run live_confirmation=empty"

          echo "[2/7] require a closed market session before disruptive restart verification"
          session="$(cd "$current_dir" && "$target_dir/venv/bin/python" - <<'PY'
          from jd_holdings.infrastructure.market_clock import MarketClock
          print(MarketClock().classify_session())
          PY
          )"
          echo "market_session=$session"
          test "$session" = "closed"

          echo "[3/7] inspect real service/ledger before restart"
          sudo systemctl is-enabled --quiet "$service_name"
          sudo systemctl is-active --quiet "$service_name"
          pid_before="$(sudo systemctl show -p MainPID --value "$service_name")"
          test "$pid_before" -gt 0
          fingerprint_before="$("$target_dir/venv/bin/python" - "$db_path" <<'PY'
          import hashlib, json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.row_factory = sqlite3.Row
          payload = {}
          for table in ('positions', 'core_positions', 'idle_cash_state', 'trades'):
              rows = [dict(r) for r in db.execute(f'SELECT * FROM {table} ORDER BY 1')]
              payload[table] = rows
          payload['open_orders'] = [dict(r) for r in db.execute(
              "SELECT client_order_id, broker_order_id, symbol, side, qty, filled_qty, status, purpose "
              "FROM orders WHERE status IN ('CREATED','SUBMITTED','PENDING','PARTIAL_FILLED','UNKNOWN') "
              "ORDER BY order_id"
          )]
          raw = json.dumps(payload, sort_keys=True, ensure_ascii=False).encode()
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          "$target_dir/venv/bin/python" - "$db_path" <<'PY'
          import sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.row_factory = sqlite3.Row
          safe = list(db.execute("SELECT symbol, state FROM positions WHERE state='SAFE_MODE'"))
          unknown = list(db.execute("SELECT symbol, purpose, status FROM orders WHERE status='UNKNOWN'"))
          idle = db.execute("SELECT value FROM system_state WHERE key='idle_cash_safe_mode'").fetchone()
          if safe or unknown or (idle and idle['value'] == '1'):
              raise SystemExit(f'pre-restart safety state is not clean: safe={len(safe)} unknown={len(unknown)} idle_safe={idle[0] if idle else None}')
          print('pre_restart_state=clean')
          PY

          echo "[4/7] restart the actual systemd process and verify persistence/reconciliation"
          sudo systemctl restart "$service_name"
          for _ in $(seq 1 20); do
            if sudo systemctl is-active --quiet "$service_name"; then break; fi
            sleep 1
          done
          sudo systemctl is-active --quiet "$service_name"
          pid_after="$(sudo systemctl show -p MainPID --value "$service_name")"
          test "$pid_after" -gt 0
          test "$pid_after" != "$pid_before"
          sleep 3
          fingerprint_after="$("$target_dir/venv/bin/python" - "$db_path" <<'PY'
          import hashlib, json, sqlite3, sys
          db = sqlite3.connect(sys.argv[1])
          db.row_factory = sqlite3.Row
          payload = {}
          for table in ('positions', 'core_positions', 'idle_cash_state', 'trades'):
              rows = [dict(r) for r in db.execute(f'SELECT * FROM {table} ORDER BY 1')]
              payload[table] = rows
          payload['open_orders'] = [dict(r) for r in db.execute(
              "SELECT client_order_id, broker_order_id, symbol, side, qty, filled_qty, status, purpose "
              "FROM orders WHERE status IN ('CREATED','SUBMITTED','PENDING','PARTIAL_FILLED','UNKNOWN') "
              "ORDER BY order_id"
          )]
          raw = json.dumps(payload, sort_keys=True, ensure_ascii=False).encode()
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          test "$fingerprint_before" = "$fingerprint_after"
          "$target_dir/venv/bin/python" - "$db_path" <<'PY'
          import sqlite3, sys
          from datetime import UTC, datetime
          db = sqlite3.connect(sys.argv[1])
          db.row_factory = sqlite3.Row
          row = db.execute("SELECT value FROM system_state WHERE key='last_reconciliation'").fetchone()
          if row is None:
              raise SystemExit('last_reconciliation missing after restart')
          value = datetime.fromisoformat(row['value'])
          age = (datetime.now(UTC) - value.astimezone(UTC)).total_seconds()
          if age > 120:
              raise SystemExit(f'last_reconciliation too old: {age:.1f}s')
          safe = list(db.execute("SELECT symbol FROM positions WHERE state='SAFE_MODE'"))
          idle = db.execute("SELECT value FROM system_state WHERE key='idle_cash_safe_mode'").fetchone()
          if safe or (idle and idle['value'] == '1'):
              raise SystemExit(f'post-restart SAFE_MODE detected: positions={len(safe)} idle={idle[0] if idle else None}')
          print(f'post_restart_reconciliation_age={age:.1f}s safe_mode=clear')
          PY
          echo "pid_before=$pid_before pid_after=$pid_after ledger_fingerprint=unchanged"

          echo "[5/7] run deployed-code fault injection in an isolated Oracle temp environment"
          "$remote_python" -m venv "$verify_root/venv"
          "$verify_root/venv/bin/python" -m pip install --quiet --upgrade pip
          "$verify_root/venv/bin/pip" install --quiet -e "${current_dir}[dev]"
          cd "$current_dir"
          "$verify_root/venv/bin/python" -m pytest -q \
            tests/test_v31_operational_faults.py \
            tests/test_v31_runtime_resilience.py \
            tests/test_dry_run_restart.py \
            tests/test_v31_managed_account_safety.py

          echo "[6/7] verify logs and Telegram transport"
          test -s "$log_path"
          sudo journalctl -u "$service_name" --since '-5 minutes' --no-pager -n 30 >/tmp/jdss_runtime_verify_journal.txt
          grep -Ev 'TOKEN|SECRET|APP_KEY|APP_SECRET' /tmp/jdss_runtime_verify_journal.txt | tail -n 15 || true
          "$target_dir/venv/bin/python" - <<'PY'
          import os, requests
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          ids = [x.strip() for x in os.environ.get('TELEGRAM_ALLOWED_CHAT_IDS', '').split(',') if x.strip()]
          if not token or not ids:
              raise SystemExit('Telegram token/chat id missing')
          me = requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=15).json()
          if not me.get('ok'):
              raise SystemExit('Telegram getMe failed')
          text = '🧪 JDSS V3.1 Oracle 검증 완료\n실제 서버 재시작·정합성·fault-injection·로그·Telegram 통신을 점검 중입니다. 실매매는 OFF(dry-run)입니다.'
          for chat_id in ids:
              result = requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': chat_id, 'text': text},
                  timeout=15,
              ).json()
              if not result.get('ok'):
                  raise SystemExit(f'Telegram send failed for configured chat id')
          print(f'telegram_transport=ok recipients={len(ids)}')
          PY

          echo "[7/7] final service health"
          sudo systemctl is-active --quiet "$service_name"
          test "$(sudo systemctl show -p ExecMainStatus --value "$service_name")" = "0"
          "$target_dir/venv/bin/jdss" --config "$current_dir/strategy.yaml" toss-smoke
          echo "ORACLE_V31_RUNTIME_VERIFY=PASS"
          REMOTE

      - name: Report ChatOps verification result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Oracle V3.1 runtime 검증 성공\n\n실제 systemd 재시작·원장 보존·Reconciliation·격리 fault-injection·로그·Telegram·Toss smoke를 통과했습니다. live는 계속 OFF입니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Oracle V3.1 runtime 검증 실패\n\n운영 안전상 자동 우회하지 않았습니다. 실패 로그를 확인해야 합니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
