name: V3.2.2 Calendar Phase Robustness Research

on:
  pull_request:
    paths:
      - "scripts/research_v322_calendar_phase_robustness.py"
      - ".github/workflows/research-v322-calendar-phase.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate
        run: python -m ruff check scripts/research_v322_calendar_phase_robustness.py
      - name: Run robustness check
        run: |
          mkdir -p reports
          python scripts/research_v322_calendar_phase_robustness.py --output reports/v322_calendar_phase_robustness.json
      - uses: actions/upload-artifact@v6
        with:
          name: v322-calendar-phase-robustness-${{ github.run_id }}
          path: reports/v322_calendar_phase_robustness.json
