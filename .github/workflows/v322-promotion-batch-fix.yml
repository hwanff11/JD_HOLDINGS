name: V3.2.2 Promotion Batch Fix

on:
  push:
    branches:
      - agent/v3.2.2-production-promotion

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[v322-batch-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v3.2.2-production-promotion
      - name: Apply exact promotion edits
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "strategy.yaml": [
                  ("  core_underlyings:\n    TQQQ: QQQ\n", "  core_underlyings:\n    QQQ: QQQ\n    TQQQ: QQQ\n"),
              ],
              "tests/test_idle_cash_manager.py": [
                  ("assert state.managed_quantity == 197", "assert state.managed_quantity == 496"),
                  ("assert broker.get_buying_power(\"USD\") == Decimal(\"30300\")", "assert broker.get_buying_power(\"USD\") == Decimal(\"400\")"),
                  ("assert broker.get_holdings(\"SGOV\")[0][\"quantity\"] == \"197\"", "assert broker.get_holdings(\"SGOV\")[0][\"quantity\"] == \"496\""),
              ],
              "tests/test_strategy.py": [
                  ("assert config.version == \"JDSS-3.1.1-TWIN-H40-S3\"", "assert config.version == \"JDSS-3.2.2-RS6M-ONEWAY-HWM75\""),
              ],
              "tests/test_telegram_backtest.py": [
                  ("assert __version__ == \"3.1.1\"", "assert __version__ == \"3.2.2\""),
              ],
              "tests/test_order_flow.py": [
                  (
                      "    assert ReconciliationService(config, repository, broker).run() == {}\n\n\nclass FailingBroker",
                      "    issues = ReconciliationService(config, repository, broker).run()\n"
                      "    assert any(\n"
                      "        issue.startswith(\"V322_DIRECT_BOOSTER_STATE_PRESENT\")\n"
                      "        for issue in issues[\"TQQQ\"]\n"
                      "    )\n"
                      "    assert \"V322_DIRECT_TP_PLAN_PRESENT\" in issues[\"TQQQ\"]\n\n\nclass FailingBroker",
                  ),
              ],
          }

          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"expected text missing in {name}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/v322-promotion-batch-fix.yml").unlink()
          PY
      - name: Commit exact edits and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy.yaml tests .github/workflows/v322-promotion-batch-fix.yml
          git commit -m "test: finish V3.2.2 legacy contract migration [v322-batch-fix]"
          git push origin HEAD:agent/v3.2.2-production-promotion
