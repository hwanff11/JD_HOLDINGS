name: Deploy Oracle Dry Run

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-jdss-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[deploy-oracle-dry-run]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact latest main
        id: ref
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git checkout -B main HEAD
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Deploying exact latest main: $(git rev-parse HEAD)"

      - name: Install and verify JDSS V3.1.1
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run V3.1.1 quality gate
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest
          jdss validate-config
          grep -q 'JDSS-3.1.1-TWIN-H40-S3' strategy.yaml
          grep -q 'config_version: "3.1.1"' strategy.yaml
          grep -q 'total_capital: 50000' strategy.yaml
          grep -q 'capital_per_symbol: 20000' strategy.yaml
          grep -A3 '^idle_cash:' strategy.yaml | grep -q 'enabled: false'
          grep -q 'live_enabled: false' strategy.yaml

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          chmod 600 ~/.ssh/oracle_jdss

      - name: Deploy and smoke-test JDSS V3.1.1 in forced dry-run mode
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: ${{ vars.ORACLE_TARGET_DIR || '/home/ubuntu/JD_HOLDINGS' }}
          SYSTEMD_SERVICE: jd_holdings_bot
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
          LOCAL_PYTHON: /opt/hostedtoolcache/Python/3.12.*/x64/bin/python
          SKIP_LOCAL_CHECKS: "1"
        run: |
          set -Eeuo pipefail
          LOCAL_PYTHON="$(command -v python)" ./deploy.sh

      - name: Report ChatOps deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Oracle dry-run 배포 성공: \`$DEPLOY_REF\`\n\nV3.1.1 main 계보·CI·설정·dry-run 잠금·Toss smoke test를 통과했습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Oracle dry-run 배포 실패: \`${DEPLOY_REF:-ref 확인 실패}\`\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
