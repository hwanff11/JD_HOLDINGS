name: JDSS V3 Backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "strategy.yaml"
      - "src/jd_holdings/**"
      - "tests/**"
      - "scripts/research_v321_hwm_monthly_rebalance.py"
      - ".github/workflows/jdss-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify production V3.1.1 backtest
        run: |
          mkdir -p reports
          jdss backtest --symbol ALL --start 2011-01-01 --slippage 0.0010 \
            --output reports/backtest.json
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-backtest-${{ github.run_id }}
          path: reports/backtest.json

  hwm-monthly-reconcile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate research scripts
        run: |
          python -m ruff check scripts/research_v321_controlled_compounding.py
          python -m ruff check scripts/research_v321_hwm_monthly_rebalance.py
      - name: Run monthly HWM75 reconciliation research
        run: |
          mkdir -p reports
          python scripts/research_v321_hwm_monthly_rebalance.py \
            --output reports/v321_hwm_monthly_rebalance.json
      - uses: actions/upload-artifact@v6
        with:
          name: v321-hwm-monthly-reconcile-${{ github.run_id }}
          path: reports/v321_hwm_monthly_rebalance.json
