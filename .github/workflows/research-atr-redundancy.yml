name: JDSS V3.1.1 ATR Redundancy Research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research_atr_redundancy.py"
      - ".github/workflows/research-atr-redundancy.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Normalize and lint research script
        run: |
          ruff format scripts/research_atr_redundancy.py
          ruff check --fix scripts/research_atr_redundancy.py
          ruff check scripts/research_atr_redundancy.py
      - name: Run ATR redundancy research
        run: |
          mkdir -p reports
          python scripts/research_atr_redundancy.py \
            --output reports/atr_redundancy.json \
            --slippage 0.001
      - name: Publish research summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("reports/atr_redundancy.json").read_text(encoding="utf-8"))
          lines = [
              "# ATR redundancy proof",
              "",
              f"- 연구 종료일: {report['research_end']}",
              f"- 전 기간 strict equivalence: **{report['strict_equivalence_all_periods']}**",
              "",
              "## Actual signal ATR distribution",
              "",
              "| Symbol | Signals | ATR score distribution | ATR!=5 signals | threshold mismatch dates |",
              "|---|---:|---|---:|---:|",
          ]
          for symbol, values in report["atr_distribution"].items():
              lines.append(
                  f"| {symbol} | {values['actual_signal_dates']} | "
                  f"{values['atr_score_actual_signal_dates']} | "
                  f"{len(values['actual_signals_with_atr_not_5'])} | "
                  f"{values['threshold_equivalence_mismatch_count']} |"
              )
          lines += [
              "",
              "## Exact execution comparison",
              "",
              "| Period | Strict | Portfolio trades equal | Equity max abs diff |",
              "|---|---|---|---:|",
          ]
          for label, values in report["periods"].items():
              portfolio = values["portfolio"]
              lines.append(
                  f"| {label} | {values['strict_equivalence']} | "
                  f"{portfolio['trade_identity_equal']} | "
                  f"{portfolio['equity_max_abs_diff']:.10f} |"
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          Path("reports/atr_redundancy_summary.md").write_text(summary, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload research artifacts
        uses: actions/upload-artifact@v6
        with:
          name: atr-redundancy-${{ github.run_id }}
          path: |
            reports/atr_redundancy.json
            reports/atr_redundancy_summary.md
