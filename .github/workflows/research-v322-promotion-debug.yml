name: V3.2.2 Promotion Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quietly
        run: |
          python -m pip install --upgrade pip >/dev/null
          python -m pip install -e '.[dev]' >/dev/null
      - name: Remove temporary workflow from contract view
        run: rm -f .github/workflows/research-v322-promotion-debug.yml
      - name: Ruff concise
        run: python -m ruff check src tests
      - name: Pytest concise diagnostic
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short --maxfail=30 > /tmp/pytest.log 2>&1
          status=$?
          echo "=== PYTEST SUMMARY ==="
          grep -E '^(FAILED|ERROR|=+ .* (failed|error|passed).*=+|E   )' /tmp/pytest.log | tail -n 160 || true
          echo "=== PYTEST TAIL ==="
          tail -n 80 /tmp/pytest.log
          exit "$status"
