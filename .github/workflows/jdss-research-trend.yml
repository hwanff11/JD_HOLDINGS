name: JDSS V3 Trend Research

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  trend-research:
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[research-v3-trend]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trend_months: [6, 8, 10, 12]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Create experiment config
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          months = os.environ['TREND_MONTHS']
          text = Path('strategy.yaml').read_text(encoding='utf-8')
          text = text.replace('trend_months: 10', f'trend_months: {months}', 1)
          Path('strategy.research.yaml').write_text(text, encoding='utf-8')
          PY
        env:
          TREND_MONTHS: ${{ matrix.trend_months }}
      - name: Run backtest
        run: jdss --config strategy.research.yaml backtest --symbol ALL --start 2011-01-01 --slippage 0.0010 --output result.json
      - name: Comment compact result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TREND_MONTHS: ${{ matrix.trend_months }}
        run: |
          python - <<'PY' > comment.md
          import json, os
          r=json.load(open('result.json'))
          m=r['v3_portfolio']['metrics']
          half=m.get('half_year_returns_pct', {})
          print(f"## Trend {os.environ['TREND_MONTHS']}개월")
          print(f"- Total Return: {m['total_return_pct']:+.2f}%")
          print(f"- CAGR: {m['cagr_pct']:+.2f}%")
          print(f"- MDD: {m['mdd_pct']:.2f}%")
          print(f"- Sharpe: {m['sharpe']:.3f}")
          print(f"- 평균 노출: {m['average_exposure_pct']:.2f}%")
          print('\n| 반기 | 수익률 |')
          print('|---|---:|')
          for p,v in half.items():
              if p >= '2022-H1': print(f'| {p} | {v:+.2f}% |')
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
