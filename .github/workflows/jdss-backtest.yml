name: JDSS V3 Backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "strategy.yaml"
      - "src/jd_holdings/**"
      - "tests/**"
      - "scripts/research_v321_*.py"
      - "scripts/research_v322_*.py"
      - ".github/workflows/jdss-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verify production V3.1.1 backtest
        run: |
          mkdir -p reports
          jdss backtest --symbol ALL --start 2011-01-01 --slippage 0.0010 \
            --output reports/backtest.json
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-backtest-${{ github.run_id }}
          path: reports/backtest.json

  rs1m-exit-research:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Validate focused research scripts
        run: |
          python -m ruff check scripts/research_v321_controlled_compounding.py
          python -m ruff check scripts/research_v321_relative_strength_booster.py
          python -m ruff check scripts/research_v321_rs6m_split.py
          python -m ruff check scripts/research_v321_rs6m_monthly_lock.py
          python -m ruff check scripts/research_v321_rs6m_oneway_exit.py
          python -m ruff check scripts/research_v322_rs1m_exit.py
      - name: Run RS6M entry with RS1M exit research
        run: |
          mkdir -p reports
          python scripts/research_v322_rs1m_exit.py \
            --output reports/v322_rs1m_exit.json
      - uses: actions/upload-artifact@v6
        with:
          name: v322-rs1m-exit-${{ github.run_id }}
          path: reports/v322_rs1m_exit.json
