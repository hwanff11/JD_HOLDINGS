name: JDSS V3 Trend Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend-research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trend_months: [6, 8, 10, 12]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Create experiment config
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          months = os.environ['TREND_MONTHS']
          text = Path('strategy.yaml').read_text(encoding='utf-8')
          text = text.replace('trend_months: 10', f'trend_months: {months}', 1)
          Path('strategy.research.yaml').write_text(text, encoding='utf-8')
          PY
        env:
          TREND_MONTHS: ${{ matrix.trend_months }}
      - name: Run backtest
        run: jdss --config strategy.research.yaml backtest --symbol ALL --start 2011-01-01 --slippage 0.0010 --output result.json
      - name: Create summary
        env:
          TREND_MONTHS: ${{ matrix.trend_months }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.load(open('result.json'))
          m=r['v3_portfolio']['metrics']
          half=m.get('half_year_returns_pct', {})
          lines=[f"## Trend {os.environ['TREND_MONTHS']}개월",
                 f"- Total Return: {m['total_return_pct']:+.2f}%",
                 f"- CAGR: {m['cagr_pct']:+.2f}%",
                 f"- MDD: {m['mdd_pct']:.2f}%",
                 f"- Sharpe: {m['sharpe']:.3f}",
                 f"- 평균 노출: {m['average_exposure_pct']:.2f}%",
                 '', '| 반기 | 수익률 |', '|---|---:|']
          lines += [f'| {p} | {v:+.2f}% |' for p,v in half.items() if p >= '2022-H1']
          Path('summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
      - name: Upload research result
        uses: actions/upload-artifact@v6
        with:
          name: trend-${{ matrix.trend_months }}m-${{ github.run_id }}
          path: |
            result.json
            summary.md
