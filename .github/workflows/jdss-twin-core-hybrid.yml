name: JDSS Twin Core Hybrid Research

on:
  push:
    branches: [research/jdss-simple-strategies]
    paths:
      - scripts/research_twin_jdss_hybrid.py
      - scripts/research_twin_engine.py
      - scripts/research_twin_engine_robustness.py
      - .github/workflows/jdss-twin-core-hybrid.yml
  pull_request:
    paths:
      - scripts/research_twin_jdss_hybrid.py
      - scripts/research_twin_engine.py
      - scripts/research_twin_engine_robustness.py
      - .github/workflows/jdss-twin-core-hybrid.yml
  workflow_dispatch:
    inputs:
      end_date:
        description: Last completed U.S. trading session
        required: true
        default: "2026-08-10"

permissions:
  contents: read

concurrency:
  group: jdss-twin-core-hybrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        slippage: ["0.0005", "0.001", "0.002"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check scripts/research_twin_jdss_hybrid.py
      - name: Run unified hybrid research
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ matrix.slippage }}
        run: |
          python scripts/research_twin_jdss_hybrid.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --output reports/twin_jdss_hybrid.json \
            --markdown reports/twin_jdss_hybrid.md
      - run: cat reports/twin_jdss_hybrid.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-twin-core-hybrid-${{ github.run_id }}-${{ matrix.slippage }}
          path: |
            reports/twin_jdss_hybrid.json
            reports/twin_jdss_hybrid.md
          retention-days: 30
