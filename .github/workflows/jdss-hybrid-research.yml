name: JDSS Hybrid Research

on:
  push:
    branches: [research/jdss-hybrid-tqqq-soxl]
    paths:
      - scripts/research_hybrid_jdss.py
      - .github/workflows/jdss-hybrid-research.yml
  pull_request:
    paths:
      - scripts/research_hybrid_jdss.py
      - .github/workflows/jdss-hybrid-research.yml
  workflow_dispatch:
    inputs:
      end_date:
        description: Last completed U.S. trading session (YYYY-MM-DD)
        required: true
        default: "2026-08-10"
      slippage:
        description: One-way execution slippage
        required: true
        default: "0.001"

permissions:
  contents: read

concurrency:
  group: jdss-hybrid-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check scripts/research_hybrid_jdss.py
      - name: Run A-B-C comparison
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ inputs.slippage || '0.001' }}
        run: |
          python scripts/research_hybrid_jdss.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --output reports/hybrid_research.json \
            --markdown reports/hybrid_research.md
      - name: Publish job summary
        run: cat reports/hybrid_research.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-hybrid-research-${{ github.run_id }}
          path: |
            reports/hybrid_research.json
            reports/hybrid_research.md
          retention-days: 30
