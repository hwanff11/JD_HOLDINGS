name: JDSS Rotation Robustness

on:
  push:
    branches: [research/jdss-simple-strategies]
    paths:
      - scripts/research_simple_strategies.py
      - scripts/research_rotation_robustness.py
      - .github/workflows/jdss-rotation-robustness.yml
  pull_request:
    paths:
      - scripts/research_simple_strategies.py
      - scripts/research_rotation_robustness.py
      - .github/workflows/jdss-rotation-robustness.yml
  workflow_dispatch:
    inputs:
      end_date:
        description: Last completed U.S. trading session (YYYY-MM-DD)
        required: true
        default: "2026-08-10"

permissions:
  contents: read

concurrency:
  group: jdss-rotation-robustness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slippage: ["0.0005", "0.001", "0.002"]
        candidate: ["N_ROTATION_TREND_CAP40", "P_ROTATION_TREND_CAP30"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint research runners
        run: |
          ruff check \
            scripts/research_simple_strategies.py \
            scripts/research_rotation_robustness.py
      - name: Run robustness checks
        env:
          END_DATE: ${{ inputs.end_date || '2026-08-10' }}
          SLIPPAGE: ${{ matrix.slippage }}
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          python scripts/research_rotation_robustness.py \
            --end "$END_DATE" \
            --slippage "$SLIPPAGE" \
            --candidate "$CANDIDATE" \
            --output reports/rotation_robustness.json \
            --markdown reports/rotation_robustness.md
      - name: Publish job summary
        run: cat reports/rotation_robustness.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: jdss-rotation-robustness-${{ github.run_id }}-${{ matrix.candidate }}-${{ matrix.slippage }}
          path: |
            reports/rotation_robustness.json
            reports/rotation_robustness.md
          retention-days: 30
