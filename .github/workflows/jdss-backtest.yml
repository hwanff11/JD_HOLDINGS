name: JDSS Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "백테스트 종목"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - TQQQ
          - SOXL
      start:
        description: "시작일 (YYYY-MM-DD)"
        required: false
        default: "2011-01-01"
        type: string
      end:
        description: "종료일 (비워두면 최신 완결 거래일)"
        required: false
        default: ""
        type: string
      slippage:
        description: "슬리피지 (예: 0.0010)"
        required: false
        default: "0.0010"
        type: string
      issue_number:
        description: "결과를 남길 Issue 번호 (선택)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run backtest
        env:
          INPUT_SYMBOL: ${{ inputs.symbol }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_SLIPPAGE: ${{ inputs.slippage }}
        run: |
          set -Eeuo pipefail
          mkdir -p reports
          args=(backtest --symbol "$INPUT_SYMBOL" --start "$INPUT_START" --slippage "$INPUT_SLIPPAGE" --output reports/backtest.json)
          if [[ -n "$INPUT_END" ]]; then
            args+=(--end "$INPUT_END")
          fi
          jdss "${args[@]}"

      - name: Create summary
        env:
          INPUT_SYMBOL: ${{ inputs.symbol }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_SLIPPAGE: ${{ inputs.slippage }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("reports/backtest.json").read_text(encoding="utf-8"))
          lines = [
              "# JDSS 백테스트 결과",
              "",
              f"- 종목: {os.environ['INPUT_SYMBOL']}",
              f"- 기간: {os.environ['INPUT_START']} ~ {os.environ['INPUT_END'] or '최신 완결 거래일'}",
              f"- 슬리피지: {os.environ['INPUT_SLIPPAGE']}",
              f"- 전략 버전: {report['strategy_version']}",
              "",
              "| 구분 | Total Return | CAGR | MDD | 거래 횟수 |",
              "|---|---:|---:|---:|---:|",
          ]
          for symbol, result in report["results"].items():
              metrics = result["metrics"]
              lines.append(
                  f"| {symbol} | {metrics['total_return_pct']:+.2f}% | "
                  f"{metrics['cagr_pct']:+.2f}% | {metrics['mdd_pct']:.2f}% | "
                  f"{metrics['closed_cycles']} |"
              )
          portfolio = report.get("portfolio_metrics", {})
          if portfolio:
              lines.extend([
                  "",
                  "## 포트폴리오",
                  "",
                  f"- Total Return: {portfolio['total_return_pct']:+.2f}%",
                  f"- CAGR: {portfolio['cagr_pct']:+.2f}%",
                  f"- MDD: {portfolio['mdd_pct']:.2f}%",
              ])
          summary = "\n".join(lines) + "\n"
          Path("reports/backtest.md").write_text(summary, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdss-backtest-${{ github.run_id }}
          path: reports/backtest.*

      - name: Comment result on Issue
        if: ${{ inputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file reports/backtest.md
