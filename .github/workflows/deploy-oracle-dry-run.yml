name: Deploy Oracle Dry Run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main commit SHA to deploy (blank = current main)"
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: oracle-jdss-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, '[deploy-oracle-dry-run]'))
    runs-on: ubuntu-latest
    environment: oracle-dry-run
    steps:
      - name: Resolve deployment ref
        id: ref
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "issues" ]]; then
            requested_ref="$(printf '%s\n' "$ISSUE_BODY" | sed -nE 's/^ref:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' | head -n 1)"
            if [[ -z "$requested_ref" ]]; then
              echo "ChatOps 배포 요청에는 'ref: <40자리 main SHA>'가 필요합니다." >&2
              exit 1
            fi
            echo "ref=$requested_ref" >> "$GITHUB_OUTPUT"
          elif [[ -n "$REQUESTED_REF" ]]; then
            echo "ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout requested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          git checkout -B main HEAD
          echo "Deploying $(git rev-parse HEAD) from main history"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and verify JDSS 2.2
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest
          jdss validate-config
          grep -q 'JDSS-2.2.2-SGOV' strategy.yaml

      - name: Prepare SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "$ORACLE_SSH_KEY"
          test -n "$ORACLE_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_jdss
          chmod 600 ~/.ssh/oracle_jdss

      - name: Deploy and smoke-test JDSS 2.2 in forced dry-run mode
        env:
          SSH_KEY_PATH: /home/runner/.ssh/oracle_jdss
          SERVER_HOST: ${{ secrets.ORACLE_HOST }}
          SERVER_USER: ${{ vars.ORACLE_USER || 'ubuntu' }}
          SERVER_TARGET_DIR: ${{ vars.ORACLE_TARGET_DIR || '/home/ubuntu/JD_HOLDINGS' }}
          SYSTEMD_SERVICE: jd_holdings_bot
          REMOTE_PYTHON_BIN: ${{ vars.ORACLE_PYTHON || 'python3.12' }}
          LOCAL_PYTHON: /opt/hostedtoolcache/Python/3.12.*/x64/bin/python
          SKIP_LOCAL_CHECKS: "1"
        run: |
          set -Eeuo pipefail
          LOCAL_PYTHON="$(command -v python)" ./deploy.sh

      - name: Report ChatOps deployment result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="✅ Oracle dry-run 배포 성공: \`$DEPLOY_REF\`\n\nmain 계보·CI·설정·dry-run 잠금·Toss smoke test를 통과했습니다.\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          else
            message="❌ Oracle dry-run 배포 실패: \`${DEPLOY_REF:-ref 확인 실패}\`\n\nActions run: [\`$RUN_ID\`]($RUN_URL)"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%b' "$message")"
