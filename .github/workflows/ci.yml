name: CI - Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint - Ruff
        run: ruff check .

      - name: Unit tests - Pytest
        run: pytest --cov=jd_holdings --cov-report=term-missing --cov-fail-under=75

      - name: Config validation - JDSS
        run: jdss validate-config
