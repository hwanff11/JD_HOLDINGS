name: FINAL Dry Run

on:
  pull_request:
    paths:
      - "strategy.yaml"
      - "src/jd_holdings/**"
      - "tests/test_final_dry_run.py"
      - ".github/workflows/final-dry-run.yml"

permissions:
  contents: read

jobs:
  final-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run FINAL end-to-end dry run
        run: pytest -q tests/test_final_dry_run.py
