name: Research Backtest

on:
  pull_request:
    paths:
      - "scripts/backtest_v2_final_d257_report.py"
      - "scripts/backtest_v2_gap_grid.py"
      - "scripts/backtest_v2_remainder_exit.py"
      - "scripts/backtest_v2_focus.py"
      - "src/jd_holdings/backtest/**"
      - "src/jd_holdings/core/**"
      - "strategy.yaml"
      - ".github/workflows/research-backtest.yml"

permissions:
  contents: read

jobs:
  final-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/backtest_v2_final_d257_report.py --output reports/v2_final_d257_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: jdss-v2-final-d257-report
          path: |
            reports/v2_final_d257_report.json
            reports/v2_final_d257_report.md
